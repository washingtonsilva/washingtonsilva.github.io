name: Validar tutorial R/tidyverse

on:
  push:
    paths:
      - "tutorials/r-tidyverse/**"
      - ".github/workflows/validar-r-tidyverse.yml"
  pull_request:
    paths:
      - "tutorials/r-tidyverse/**"
      - ".github/workflows/validar-r-tidyverse.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::here
            any::tidyverse
            any::knitr
      - name: Executar validação do tutorial
        run: Rscript tutorials/r-tidyverse/tests/validar-tutorial.R
